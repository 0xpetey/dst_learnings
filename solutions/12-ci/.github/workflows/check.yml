# The acceptance suite, on every push and every pull request. One job,
# one script, and it is the script you run at home: scripts/check.sh.
# If the workspace is not the root of your repository, add
#   defaults: { run: { working-directory: project } }
# under the job.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned version.
      # Module 3's bare-metal check needs one extra target.
      - run: rustup toolchain install && rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
