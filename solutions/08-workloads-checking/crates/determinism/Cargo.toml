[package]
name = "determinism"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Seeded PRNG, trace log and the determinism check used by every later module."

[features]
default = ["std"]
# The harness spawns processes and the `trace_hash` binary prints; both need std.
std = []

[dependencies]

[dev-dependencies]
# Only used to prove that our hand-rolled xoshiro256++ matches the reference.
rand_xoshiro = "0.8"
rand_core = "0.10"
# Only used as a *source of nondeterminism* in the hazard tests.
rand = "0.10"

[[bin]]
name = "trace_hash"
path = "src/bin/trace_hash.rs"
required-features = ["std"]

[lints]
workspace = true
