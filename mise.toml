[tools]
node = "latest"

# `mise run check` runs every reference solution's acceptance suite, one after
# another. `mise run check:NN` runs one module's. `mise run check:project`
# runs the suite in your own workspace, with whichever scripts/check.sh you
# copied in last. `mise run sweep` runs the capstone's twenty thousand seeds,
# `mise run sweep --jobs 4` with four children instead of eight. `mise run hunt`
# hunts the planted bug of Module 11 through the same seeds, and exits
# non-zero when it catches it, which is the expected result.

[tasks.check]
description = "Run every reference solution's check.sh, in order"
# A list in `run` is sequential. `depends` runs in parallel, and the thread
# tests in Module 1 and the timing lines in the sweeps want the machine to
# themselves.
run = [
  "mise run check:01",
  "mise run check:02",
  "mise run check:03",
  "mise run check:04",
  "mise run check:05",
  "mise run check:06",
  "mise run check:07",
  "mise run check:08",
  "mise run check:09",
  "mise run check:10",
  "mise run check:11",
  "mise run check:12",
  "mise run check:13",
]

[tasks.sweep]
description = "Twenty thousand seeds of the final solution, as a batch"
dir = "solutions/13-landscape"
# About two minutes at eight jobs on an eight-core laptop. The last line is
# the sweep hash, which d8cc45fc8ef93f20 pins for this toolchain and OS.
run = 'cargo run --release --locked -q -p vopr -- --batch 20000 --from 0 --jobs {{option(name="jobs", default="8")}}'

[tasks.hunt]
description = "Hunt a planted bug through twenty thousand seeds, one child process each"
dir = "solutions/13-landscape"
# `--nodes 3 --no-core` because the forgotten promise was planted before
# those draws existed, and seeds 9916 and 16345 catch it under them. About
# five minutes. Only the failures and the summary are printed, and the exit
# status is the hunt's, so a caught bug is a non-zero exit.
shell = "bash -c"
run = '''
set -o pipefail
cargo run --release --locked -q -p vopr -- --hunt {{option(name="seeds", default="0..20000")}} \
  --nodes 3 --no-core --bugs {{option(name="bugs", default="forgotten_promise")}} | grep -v " ok$"
'''

[tasks."check:project"]
description = "Run scripts/check.sh in your own workspace"
dir = "project"
run = "scripts/check.sh"

[tasks."check:01"]
description = "Module 1: determinism"
dir = "solutions/01-determinism"
run = "scripts/check.sh"

[tasks."check:02"]
description = "Module 2: architecture"
dir = "solutions/02-architecture"
run = "scripts/check.sh"

[tasks."check:03"]
description = "Module 3: Rust hazards"
dir = "solutions/03-rust-hazards"
run = "scripts/check.sh"

[tasks."check:04"]
description = "Module 4: virtual time"
dir = "solutions/04-virtual-time"
run = "scripts/check.sh"

[tasks."check:05"]
description = "Module 5: simulated network"
dir = "solutions/05-sim-network"
run = "scripts/check.sh"

[tasks."check:06"]
description = "Module 6: simulated disk"
dir = "solutions/06-sim-disk"
run = "scripts/check.sh"

[tasks."check:07"]
description = "Module 7: fault injection"
dir = "solutions/07-fault-injection"
run = "scripts/check.sh"

[tasks."check:08"]
description = "Module 8: workloads and checking"
dir = "solutions/08-workloads-checking"
run = "scripts/check.sh"

[tasks."check:09"]
description = "Module 9: the VOPR"
dir = "solutions/09-vopr"
run = "scripts/check.sh"

[tasks."check:10"]
description = "Module 10: consensus"
dir = "solutions/10-consensus"
