[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# A simulator must not have two behaviours. Overflow checks and debug
# assertions stay on in every profile, so a seed that fails in CI fails the
# same way on a laptop and a release build cannot hide an overflow.
[profile.dev]
overflow-checks = true
debug-assertions = true

[profile.release]
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
